apiVersion: v1
kind: Secret
metadata:
  name: skillforge-secrets
  namespace: skillforge
type: Opaque
stringData:
  INTERNAL_API_KEY: "replace-with-secure-api-key"
  SUPABASE_URL: "replace-with-supabase-url"
  SUPABASE_SERVICE_ROLE_KEY: "replace-with-supabase-service-role-key"
  GROQ_API_KEY: "replace-with-groq-api-key"
