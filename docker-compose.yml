version: "3.8"

services:
  ai-service:
    build:
      context: ./skillforge/ai-service
    ports:
      - "8000:8000"
    env_file:
      - ./skillforge/ai-service/.env
    networks:
      - skillforge-network

  api-gateway:
    build:
      context: ./skillforge/api-gateway
    ports:
      - "5000:5000"
    environment:
      - AI_SERVICE_URL=http://ai-service:8000
    env_file:
      - ./skillforge/api-gateway/.env
    networks:
      - skillforge-network
    depends_on:
      - ai-service

  client:
    build:
      context: ./skillforge/client
    ports:
      - "3000:80"
    networks:
      - skillforge-network
    depends_on:
      - api-gateway

networks:
  skillforge-network:
    driver: bridge
