version: "3.9"
services:
  client:
    build: ./client
    ports: ["3000:80"]
    depends_on: [api-gateway]

  api-gateway:
    build: ./api-gateway
    ports: ["4000:4000"]
    env_file: ./api-gateway/.env
    depends_on: [ai-service]

  ai-service:
    build: ./ai-service
    ports: ["8000:8000"]
    env_file: ./ai-service/.env

networks:
  default:
    name: skillforge-network
